name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt -l found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test -race ./...
      - name: Build (stripped)
        run: go build -ldflags="-s -w" -v .

  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install/uninstall cycle
        run: scripts/smoke.sh

  # Not a build check -- captures the real BSD --help/man output for the
  # classic tools weir's rules.go regexes are written against, since none of
  # us have a Mac to read it from directly. rules.go's regexes and Fix text
  # are calibrated against GNU semantics (verified against this project's own
  # Linux dev host); this job's log is the primary source for auditing where
  # macOS's default BSD grep/sed/find/ps/awk actually diverge. See
  # data/FLAG-OVERLAP-REVIEW.md for the GNU-side sweep this mirrors.
  macos-classic-tool-survey:
    runs-on: macos-latest
    steps:
      - name: Dump BSD tool help/man text
        run: |
          for t in grep sed find ps awk; do
            echo "::group::$t --help"
            "$t" --help 2>&1 || true
            echo "::endgroup::"
            echo "::group::man $t"
            man "$t" 2>&1 | col -b || true
            echo "::endgroup::"
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
